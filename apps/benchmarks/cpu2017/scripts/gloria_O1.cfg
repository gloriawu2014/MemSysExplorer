tune            = base

# compiler versions
# gcc: 13.1.0
# g++: 13.1.0
# fortran: 13.1.0

CC              = gcc
CXX             = g++
FC              = gfortran

COPTIMIZE	      = -O1 -fcommon -Wno-error
CXXOPTIMIZE       = -O1 -std=gnu++03
FOPTIMIZE	      = -O1 -fallow-argument-mismatch

CPORTABILITY        = -DSPEC_LINUX_X64 -std=gnu99 -fwrapv -fno-strict-aliasing -DSPEC_NO_STRICT_STRING
CXXPORTABILITY      = -DSPEC_LINUX_X64
FPORTABILITY        = -DSPEC_LINUX_X64
CC_VERSION_OPTION   = -v
CXX_VERSION_OPTION  = -v
FC_VERSION_OPTION   = -v

makeflags	= -j8

500.perlbench_r,600.perlbench_s=base:
    CPORTABILITY += -DSPEC_LP64

602.gcc_s,502.gcc_r=base:
    CPORTABILITY += -fgnu89-inline -DSPEC_LP64

523.xalancbmk_r,623.xalancbmk_s=base:
    CXXPORTABILITY += -DSPEC_LP64
    CXXOPTIMIZE    += -std=c++03 -fpermissive
    PORTABILITY   += -DSPEC_%{os}

521.wrf_r,621.wrf_s:
   CPORTABILITY  += -DSPEC_CASE_FLAG
   FPORTABILITY  += -fconvert=big-endian

628.pop2_s:
   CPORTABILITY    += -DSPEC_CASE_FLAG
   FPORTABILITY    += -fconvert=big-endian

526.blender_r:
   PORTABILITY   += -funsigned-char -DSPEC_LINUX -D_BOOL_CUSTOM -DSPEC_LP64
   CXXOPTIMIZE   += -march=native
   COPTIMIZE     += -march=native

527.cam4_r,627.cam4_s:
   PORTABILITY   += -DSPEC_CASE_FLAG

