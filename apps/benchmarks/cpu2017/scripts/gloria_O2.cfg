tune            = base

# compiler versions
# gcc: 13.1.0
# g++: 13.1.0
# fortran: 13.1.0


CC              = gcc
CXX             = g++
FC              = gfortran

COPTIMIZE       = -O2 -fcommon -Wno-error
CXXOPTIMIZE     = -O2 -std=gnu++03
FOPTIMIZE       = -O2 -fallow-argument-mismatch

CPORTABILITY        = -DSPEC_LINUX_X64 -std=gnu99 -fwrapv -fno-strict-aliasing -DSPEC_NO_STRICT_STRING
CXXPORTABILITY      = -DSPEC_LINUX_X64 -DLINUX
FPORTABILITY        = -DSPEC_LINUX_X64
CC_VERSION_OPTION   = -v
CXX_VERSION_OPTION  = -v
FC_VERSION_OPTION   = -v

makeflags       = -j8

500.perlbench_r,600.perlbench_s=base:
   CPORTABILITY += -DSPEC_LP64

602.gcc_s,502.gcc_r=base:
   CPORTABILITY += -fgnu89-inline -DSPEC_LP64

523.xalancbmk_r,623.xalancbmk_s=base:
   # Ensure we have the base portability from the global section plus benchmark specific ones
   PORTABILITY    = -DSPEC_LP64 -D_GNU_SOURCE -DXML_BITSTOBUILD_64
   
   # We use -DXML_HAS_CPP_NAMESPACE to help with the xercesc_2_7 scope issues
   # Added -DXML_USE_GCC_INTERLOCKS to resolve atomicIncrement/decrement errors
   CXXPORTABILITY = -DPLATFORM_LINUX -D__linux__ \
                    -DXML_USE_PTHREADS -DXML_USE_NETACCESSOR_SOCKET \
                    -DXML_USE_LIBICONV_TRANCODER -DXML_USE_INMEM_MESSAGELOADER \
                    -DXML_BITSTOBUILD_64 -DXML_HAS_CPP_NAMESPACE \
                    -DXML_USE_GCC_INTERLOCKS
   
   # -fpermissive is necessary for this older C++ code on GCC 13
   CXXOPTIMIZE    = -O2 -std=c++03 -fpermissive -Wno-error -Wno-builtin-macro-redefined

   # Explicitly link the math and pthread libraries
   EXTRA_LIBS     = -lm -lpthread

521.wrf_r,621.wrf_s:
   CPORTABILITY  += -DSPEC_CASE_FLAG
   FPORTABILITY  += -fconvert=big-endian

628.pop2_s:
   CPORTABILITY    += -DSPEC_CASE_FLAG
   FPORTABILITY    += -fconvert=big-endian

526.blender_r:
   PORTABILITY   += -funsigned-char -DSPEC_LINUX -D_BOOL_CUSTOM -DSPEC_LP64
   CXXOPTIMIZE   += -march=native
   COPTIMIZE     += -march=native

527.cam4_r,627.cam4_s:
   PORTABILITY   += -DSPEC_CASE_FLAG

